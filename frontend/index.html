<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/LogoImg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pha Din Weather Radar Station</title>
    <script>
      // Apply saved theme before React mounts so non-dashboard pages match it
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
